[package]
name = "heaplens-alloc"
version = "0.1.0"
edition = "2021"

[dependencies]
heaplens-protocol = { path = "../heaplens-protocol" }
backtrace = "0.3"
iced = { version = "0.13", features = ["tokio"] }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
